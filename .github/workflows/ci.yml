name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a rapid series of pushes does not
# burn minutes on commits nobody will ship.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: types, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The unit tests need no credentials. The contract suite additionally
      # checks that every dynamically built PostgREST query actually parses,
      # which needs the project URL and the *publishable* key. Both are public
      # by design: the publishable key ships in the client bundle, and the anon
      # role can only be denied by RLS. The service secret is never needed
      # here, so CI requires and stores no privileged credential.
      #
      # These come from repository variables, not secrets. If they are unset
      # the contract suite skips itself rather than failing, so the rest of CI
      # still runs. Set them under
      # Settings > Secrets and variables > Actions > Variables to enable the
      # contract coverage.
      - name: Unit tests
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # The build was verified to succeed with no Supabase env vars set at all,
      # so this step cannot fail on a missing or placeholder credential.
      - name: Build
        run: npm run build
